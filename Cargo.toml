[workspace]
members = [
    "crates/browser",
    "crates/crawler",
    "crates/recorder",
    "crates/session",
    "crates/notifier",
    "crates/exporter",
    "crates/scanner",
    "crates/credentials",
    "crates/auth-profiles",
    "crates/network",
    "crates/passwords",
    "crates/os-pentest",
    "crates/mobile",
    "crates/cloud",
    "crates/web3",
    "crates/gray-team",
    "crates/blue-team",
    "crates/white-team",
    "crates/cross-team",
    "crates/http-proxy",
    "crates/packet-capture",
    "crates/auth-engine",
]
resolver = "2"

[package]
name = "site-recorder"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech <https://github.com/CharaTech>"]
description = "Cross-platform desktop application for automated site traversal and browser activity recording"
license = "MIT"

[dependencies]
# Tauri for cross-platform GUI
tauri = { version = "1.5", features = ["api-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
headless_chrome = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
signal-hook = "0.3"
indicatif = "0.17"
libc = "0.2"
ctrlc = "3.4"
printpdf = "0.7"

# Workspace crates
browser = { path = "crates/browser" }
crawler = { path = "crates/crawler" }
recorder = { path = "crates/recorder" }
session = { path = "crates/session" }
notifier = { path = "crates/notifier" }
exporter = { path = "crates/exporter" }
scanner = { path = "crates/scanner" }
credentials = { path = "crates/credentials" }
auth-profiles = { path = "crates/auth-profiles" }
network = { path = "crates/network" }
passwords = { path = "crates/passwords" }
os-pentest = { path = "crates/os-pentest" }
mobile = { path = "crates/mobile" }
cloud = { path = "crates/cloud" }
web3 = { path = "crates/web3" }
gray-team = { path = "crates/gray-team" }
blue-team = { path = "crates/blue-team" }
white-team = { path = "crates/white-team" }
cross-team = { path = "crates/cross-team" }
http-proxy = { path = "crates/http-proxy" }
packet-capture = { path = "crates/packet-capture" }
auth-engine = { path = "crates/auth-engine" }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# TOTP
totp-rs = { version = "5.5", features = ["qr"] }

# Crypto utilities
rand = "0.8"
base64 = "0.21"
aes-gcm = "0.10"
argon2 = "0.5"

# Paths
dirs = "5.0"

[build-dependencies]
tauri-build = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1


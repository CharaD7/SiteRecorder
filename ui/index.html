<!DOCTYPE html>
<html lang="en" data-theme="dark" data-team="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteRecorder CyberOps</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout" id="appLayout">
        <!-- ========== TOP BAR ========== -->
        <header class="topbar">
            <div class="topbar-brand">
                <span class="brand-icon">⚡</span>
                <span>SiteRecorder</span>
                <span class="badge badge-info" style="font-size:10px; margin-left:4px;">CyberOps</span>
            </div>

            <div class="topbar-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="globalSearch" placeholder="Search assets, findings, commands...">
                <span class="search-shortcut">⌘K</span>
            </div>

            <div class="topbar-actions">
                <button class="topbar-btn" data-tooltip="Active Operations" id="opsBtn">
                    <span id="opsIndicator">🔴</span>
                    <span class="badge" id="activeOpsBadge" style="display:none;">0</span>
                </button>
                <button class="topbar-btn" data-tooltip="Notifications" id="notifBtn">
                    🔔
                    <span class="badge empty" id="notifBadge">0</span>
                </button>
                <button class="topbar-btn" data-tooltip="Documentation" id="docsBtn">📖</button>
                <button class="topbar-btn" data-tooltip="Toggle theme" id="themeToggleBtn">🌙</button>
                <button class="topbar-btn" data-tooltip="Settings" id="settingsBtn">⚙️</button>
                <div class="topbar-avatar" data-tooltip="Operator" id="userAvatar">OP</div>
            </div>
        </header>

        <!-- ========== TEAM TABS ========== -->
        <nav class="team-tabs" id="teamTabs">
            <button class="team-tab active" data-team="red" id="tabRed">
                <span class="team-icon">🔴</span>
                <span>Red Team</span>
                <span class="team-badge" id="redBadge" data-tooltip="Targets and findings loaded from the database">0</span>
            </button>
            <button class="team-tab" data-team="gray" id="tabGray">
                <span class="team-icon">🔘</span>
                <span>Gray Team</span>
                <span class="team-badge" id="grayBadge" data-tooltip="Not tracked: no backend call reports a count for this team, so none is shown">—</span>
            </button>
            <button class="team-tab" data-team="blue" id="tabBlue">
                <span class="team-icon">🔵</span>
                <span>Blue Team</span>
                <span class="team-badge" id="blueBadge" data-tooltip="Not tracked: no backend call reports a count for this team, so none is shown">—</span>
            </button>
            <button class="team-tab" data-team="white" id="tabWhite">
                <span class="team-icon">⚪</span>
                <span>White Team</span>
                <span class="team-badge" id="whiteBadge" data-tooltip="Not tracked: no backend call reports a count for this team, so none is shown">—</span>
            </button>
        </nav>

        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Dynamic content based on active team -->
            </nav>
            <div class="sidebar-toggle">
                <button id="sidebarCollapseBtn" data-tooltip="Collapse sidebar">
                    ◀
                </button>
            </div>
        </aside>

        <!-- ========== CONTENT AREA ========== -->
        <main class="content">
            <!-- Outside contentArea on purpose: renderTemplate() clears that
                 element, so a banner inside it would vanish on every page render. -->
            <div id="dbStatusBanner" style="margin-bottom:12px;"></div>
            <div id="contentArea">
            <!-- Dynamic content based on active section -->
            </div>
        </main>
    </div>

    <!-- ========== COMMAND PALETTE ========== -->
    <div class="command-palette-overlay" id="commandPalette" style="display:none;">
        <div class="command-palette">
            <div class="command-palette-input">
                <span>🔍</span>
                <input type="text" id="commandInput" placeholder="Type a command or search...">
            </div>
            <div class="command-palette-results" id="commandResults">
                <!-- Dynamic command list -->
            </div>
        </div>
    </div>

    <!-- ========== TOAST CONTAINER ========== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ========== MODAL CONTAINER ========== -->
    <div id="modalContainer"></div>

    <!-- ========== TEAM TEMPLATES ========== -->

    <!-- RED TEAM Sidebar -->
    <template id="sidebar-red">
        <div class="sidebar-section">
            <div class="sidebar-section-title">Operations</div>
            <button class="sidebar-item active" data-section="red-dashboard">
                <span class="item-icon">📊</span>
                <span class="item-label">Dashboard</span>
            </button>
            <button class="sidebar-item" data-section="red-targets">
                <span class="item-icon">🎯</span>
                <span class="item-label">Targets</span>
                <span class="item-badge" id="targetCount">0</span>
            </button>
            <button class="sidebar-item" data-section="red-scans">
                <span class="item-icon">🔍</span>
                <span class="item-label">Scans</span>
                <span class="item-badge" id="activeScanCount">0</span>
            </button>
            <button class="sidebar-item" data-section="red-findings">
                <span class="item-icon">⚠️</span>
                <span class="item-label">Findings</span>
                <span class="item-badge" id="findingCount">0</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Attack Arsenal</div>
            <button class="sidebar-item" data-section="red-web">
                <span class="item-icon">🌐</span>
                <span class="item-label">Web Apps</span>
            </button>
            <button class="sidebar-item" data-section="apiscanner">
                <span class="item-icon">🔌</span>
                <span class="item-label">API Scanner</span>
            </button>
            <button class="sidebar-item" data-section="red-network">
                <span class="item-icon">🔌</span>
                <span class="item-label">Network</span>
            </button>
            <button class="sidebar-item" data-section="red-os">
                <span class="item-icon">💻</span>
                <span class="item-label">OS Pentest</span>
            </button>
            <button class="sidebar-item" data-section="red-mobile">
                <span class="item-icon">📱</span>
                <span class="item-label">Mobile</span>
            </button>
            <button class="sidebar-item" data-section="red-cloud">
                <span class="item-icon">☁️</span>
                <span class="item-label">Cloud</span>
            </button>
            <button class="sidebar-item" data-section="red-web3">
                <span class="item-icon">⛓️</span>
                <span class="item-label">Web3</span>
            </button>
            <button class="sidebar-item" data-section="red-email">
                <span class="item-icon">📧</span>
                <span class="item-label">Email</span>
            </button>
            <button class="sidebar-item" data-section="red-wireless">
                <span class="item-icon">📡</span>
                <span class="item-label">Wireless</span>
            </button>
            <button class="sidebar-item" data-section="red-passwords">
                <span class="item-icon">🔑</span>
                <span class="item-label">Passwords</span>
            </button>
            <button class="sidebar-item" data-section="red-exploit">
                <span class="item-icon">💥</span>
                <span class="item-label">Exploitation</span>
            </button>
            <button class="sidebar-item" data-section="http-proxy">
                <span class="item-icon">🌐</span>
                <span class="item-label">HTTP Proxy</span>
            </button>
            <button class="sidebar-item" data-section="packet-capture">
                <span class="item-icon">📡</span>
                <span class="item-label">Packet Capture</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Recording</div>
            <button class="sidebar-item" data-section="red-recording">
                <span class="item-icon">🎬</span>
                <span class="item-label">Screen Recording</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Testing Tools</div>
            <button class="sidebar-item" data-section="packet-inspector">
                <span class="item-icon">🕵️</span>
                <span class="item-label">Packet Inspector</span>
            </button>
            <button class="sidebar-item" data-section="spammer">
                <span class="item-icon">📣</span>
                <span class="item-label">Spammer</span>
            </button>
            <button class="sidebar-item" data-section="sequencer">
                <span class="item-icon">🔢</span>
                <span class="item-label">Sequencer</span>
            </button>
            <button class="sidebar-item" data-section="collaborator">
                <span class="item-icon">🤝</span>
                <span class="item-label">Collaborator</span>
            </button>
            <button class="sidebar-item" data-section="live-triage">
                <span class="item-icon">📺</span>
                <span class="item-label">Live Triage Console</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Utilities</div>
            <button class="sidebar-item" data-section="red-osint">
                <span class="item-icon">🕵️</span>
                <span class="item-label">OSINT</span>
            </button>
            <button class="sidebar-item" data-section="red-payloads">
                <span class="item-icon">📦</span>
                <span class="item-label">Payloads</span>
            </button>
            <button class="sidebar-item" data-section="red-sessions">
                <span class="item-icon">🔐</span>
                <span class="item-label">Sessions</span>
            </button>
            <button class="sidebar-item" data-section="red-auth-profiles">
                <span class="item-icon">🔑</span>
                <span class="item-label">Auth Profiles</span>
            </button>
            <button class="sidebar-item" data-section="red-totp">
                <span class="item-icon">⏱️</span>
                <span class="item-label">TOTP Generator</span>
            </button>
            <button class="sidebar-item" data-section="red-reports">
                <span class="item-icon">📋</span>
                <span class="item-label">Reports</span>
            </button>
        </div>
    </template>

    <!-- GRAY TEAM Sidebar -->
    <template id="sidebar-gray">
        <div class="sidebar-section">
            <div class="sidebar-section-title">Operations</div>
            <button class="sidebar-item active" data-section="gray-dashboard">
                <span class="item-icon">📊</span>
                <span class="item-label">Dashboard</span>
            </button>
            <button class="sidebar-item" data-section="gray-simulations">
                <span class="item-icon">⚔️</span>
                <span class="item-label">Simulations</span>
            </button>
            <button class="sidebar-item" data-section="gray-matrix">
                <span class="item-icon">🗺️</span>
                <span class="item-label">ATT&CK Matrix</span>
            </button>
            <button class="sidebar-item" data-section="gray-purple">
                <span class="item-icon">🤝</span>
                <span class="item-label">Purple Team</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Analysis</div>
            <button class="sidebar-item" data-section="gray-threatmodel">
                <span class="item-icon">🧩</span>
                <span class="item-label">Threat Model</span>
            </button>
            <button class="sidebar-item" data-section="gray-correlation">
                <span class="item-icon">🔗</span>
                <span class="item-label">Correlation</span>
            </button>
            <button class="sidebar-item" data-section="gray-detections">
                <span class="item-icon">🛡️</span>
                <span class="item-label">Detections</span>
            </button>
            <button class="sidebar-item" data-section="gray-surface">
                <span class="item-icon">🌍</span>
                <span class="item-label">Attack Surface</span>
            </button>
            <button class="sidebar-item" data-section="gray-reports">
                <span class="item-icon">📋</span>
                <span class="item-label">Reports</span>
            </button>
        </div>
    </template>

    <!-- BLUE TEAM Sidebar -->
    <template id="sidebar-blue">
        <div class="sidebar-section">
            <div class="sidebar-section-title">Operations</div>
            <button class="sidebar-item active" data-section="blue-dashboard">
                <span class="item-icon">📊</span>
                <span class="item-label">SOC Dashboard</span>
            </button>
            <button class="sidebar-item" data-section="blue-alerts">
                <span class="item-icon">🚨</span>
                <span class="item-label">Alerts</span>
                <span class="item-badge" id="alertCount">0</span>
            </button>
            <button class="sidebar-item" data-section="blue-incidents">
                <span class="item-icon">🔥</span>
                <span class="item-label">Incidents</span>
                <span class="item-badge" id="incidentCount">0</span>
            </button>
            <button class="sidebar-item" data-section="blue-hunt">
                <span class="item-icon">🔍</span>
                <span class="item-label">Threat Hunting</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Analysis</div>
            <button class="sidebar-item" data-section="blue-intel">
                <span class="item-icon">🧠</span>
                <span class="item-label">Intel</span>
            </button>
            <button class="sidebar-item" data-section="blue-logs">
                <span class="item-icon">📝</span>
                <span class="item-label">Log Analysis</span>
            </button>
            <button class="sidebar-item" data-section="blue-forensics">
                <span class="item-icon">🔬</span>
                <span class="item-label">Forensics</span>
            </button>
            <button class="sidebar-item" data-section="blue-malware">
                <span class="item-icon">🦠</span>
                <span class="item-label">Malware</span>
            </button>
            <button class="sidebar-item" data-section="blue-network">
                <span class="item-icon">🌐</span>
                <span class="item-label">Network</span>
            </button>
            <button class="sidebar-item" data-section="blue-endpoints">
                <span class="item-icon">💻</span>
                <span class="item-label">Endpoints</span>
            </button>
            <button class="sidebar-item" data-section="blue-cloud">
                <span class="item-icon">☁️</span>
                <span class="item-label">Cloud</span>
            </button>
            <button class="sidebar-item" data-section="blue-audit-log">
                <span class="item-icon">📜</span>
                <span class="item-label">Audit Log</span>
            </button>
            <button class="sidebar-item" data-section="blue-reports">
                <span class="item-icon">📋</span>
                <span class="item-label">Reports</span>
            </button>
        </div>
    </template>

    <!-- WHITE TEAM Sidebar -->
    <template id="sidebar-white">
        <div class="sidebar-section">
            <div class="sidebar-section-title">Governance</div>
            <button class="sidebar-item active" data-section="white-dashboard">
                <span class="item-icon">📊</span>
                <span class="item-label">Dashboard</span>
            </button>
            <button class="sidebar-item" data-section="white-compliance">
                <span class="item-icon">✅</span>
                <span class="item-label">Compliance</span>
            </button>
            <button class="sidebar-item" data-section="white-risk">
                <span class="item-icon">⚖️</span>
                <span class="item-label">Risk Register</span>
            </button>
            <button class="sidebar-item" data-section="white-policies">
                <span class="item-icon">📜</span>
                <span class="item-label">Policies</span>
            </button>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Management</div>
            <button class="sidebar-item" data-section="white-vendors">
                <span class="item-icon">🏢</span>
                <span class="item-label">Vendors</span>
            </button>
            <button class="sidebar-item" data-section="white-training">
                <span class="item-icon">🎓</span>
                <span class="item-label">Training</span>
            </button>
            <button class="sidebar-item" data-section="white-metrics">
                <span class="item-icon">📈</span>
                <span class="item-label">Metrics</span>
            </button>
            <button class="sidebar-item" data-section="white-reports">
                <span class="item-icon">📋</span>
                <span class="item-label">Reports</span>
            </button>
        </div>
    </template>

    <!-- ========== CONTENT TEMPLATES ========== -->

    <!-- Dashboard Template -->
    <template id="content-dashboard">
        <div class="content-header">
            <div>
                <h1 class="content-title" id="dashboardTitle">Dashboard</h1>
                <p class="content-subtitle" id="dashboardSubtitle">Security operations overview</p>
            </div>
            <div class="content-actions">
                <button class="btn btn-secondary" id="refreshDashBtn">🔄 Refresh</button>
                <button class="btn btn-primary" id="newOpBtn">+ New Operation</button>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="grid grid-4 mb-6">
            <div class="stat-card">
                <div class="stat-value" id="statTargets">0</div>
                <div class="stat-label">Active Targets</div>
                <div class="stat-change up" id="statTargetsChange">↑ 0 this week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statFindings">0</div>
                <div class="stat-label">Open Findings</div>
                <div class="stat-change down" id="statFindingsChange">↓ 0 this week</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statRisk">0.0</div>
                <div class="stat-label">Avg Risk Score</div>
                <div class="stat-change" id="statRiskChange">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statOperations">0</div>
                <div class="stat-label">Active Operations</div>
                <div class="stat-change running" id="statOperationsChange">● Running</div>
            </div>
        </div>

        <!-- Severity Distribution -->
        <div class="card mb-6">
            <div class="card-header">
                <span class="card-title">Severity Distribution</span>
                <div class="flex gap-2">
                    <button class="badge badge-critical" id="criticalCount">0 Critical</button>
                    <button class="badge badge-high" id="highCount">0 High</button>
                    <button class="badge badge-medium" id="mediumCount">0 Medium</button>
                    <button class="badge badge-low" id="lowCount">0 Low</button>
                    <button class="badge badge-info" id="infoCount">0 Info</button>
                </div>
            </div>
            <div class="card-body">
                <div class="severity-bar" id="severityBar">
                    <div class="segment segment-critical" id="criticalBar" style="width:0%"></div>
                    <div class="segment segment-high" id="highBar" style="width:0%"></div>
                    <div class="segment segment-medium" id="mediumBar" style="width:0%"></div>
                    <div class="segment segment-low" id="lowBar" style="width:0%"></div>
                    <div class="segment segment-info" id="infoBar" style="width:0%"></div>
                </div>
            </div>
        </div>

        <!-- Active Operations & Recent Activity -->
        <div class="grid grid-2">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Active Operations</span>
                    <button class="btn btn-sm btn-ghost" id="viewAllOps">View All →</button>
                </div>
                <div class="card-body" id="activeOpsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-title">No Active Operations</div>
                        <div class="empty-state-text">Launch a scan or operation to get started.</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Recent Activity</span>
                    <button class="btn btn-sm btn-ghost" id="viewAllActivity">View All →</button>
                </div>
                <div class="card-body" id="activityFeed">
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <div class="empty-state-title">No Recent Activity</div>
                        <div class="empty-state-text">Actions will appear here as you work.</div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Generic Tool Page Template -->
    <template id="content-toolpage">
        <div class="content-header">
            <div>
                <h1 class="content-title" id="toolTitle">Tool Name</h1>
                <p class="content-subtitle" id="toolSubtitle">Tool description</p>
            </div>
            <div class="content-actions" id="toolActions">
                <button class="btn btn-secondary" id="toolHelpBtn">❓ Help</button>
            </div>
        </div>
        <div id="toolContent">
            <!-- Dynamic tool content -->
        </div>
    </template>

    <!-- Live Triage Console -->
    <template id="content-live-triage">
        <div class="content-header">
            <div>
                <h1 class="content-title">📺 Live Triage Console</h1>
                <p class="content-subtitle">Real-time operational events from every tool — a live window into what's happening across the app</p>
            </div>
            <div class="content-actions" id="consoleActions">
                <button class="btn btn-ghost" id="consoleClearBtn">🗑️ Clear Log</button>
                <button class="btn btn-ghost" id="consoleExportBtn">📥 Export</button>
                <div class="btn-group">
                    <label class="switch-label" data-tooltip="Auto-refresh console">
                        <input type="checkbox" id="liveToggle" checked>
                        <span class="switch" id="liveSwitch"></span>
                        <span class="switch-text">Live</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Filter bar -->
        <div class="card mb-4">
            <div class="card-body" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" style="font-size:12px;">Level</label>
                    <select class="input input-sm" id="levelFilter">
                        <option value="all">All Levels</option>
                        <option value="debug">Debug</option>
                        <option value="info" selected>Info</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" style="font-size:12px;">Source</label>
                    <select class="input input-sm" id="sourceFilter">
                        <option value="all">All Sources</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0; flex:1; min-width:200px;">
                    <label class="form-label" style="font-size:12px;">Search</label>
                    <input type="text" class="input input-sm" id="eventSearch" placeholder="Search events...">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" style="font-size:12px;">Page</label>
                    <div style="display:flex; gap:4px; align-items:center;">
                        <button class="btn btn-ghost btn-sm" id="pagePrevBtn" title="Previous page">◀</button>
                        <span class="text-sm" id="pageIndicator" style="min-width:40px; text-align:center;">1</span>
                        <button class="btn btn-ghost btn-sm" id="pageNextBtn" title="Next page">▶</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live indicator + event count -->
        <div class="empty-state" id="eventStats" style="display:none; padding:8px 0;">
            <span class="status-dot running" style="margin-right:6px;"></span>
            <span class="text-sm" id="eventCountText">12 events · <span id="lastUpdateText">just now</span></span>
            <span class="text-sm" id="filterPills" style="margin-left:12px;"></span>
        </div>

        <!-- Event log table -->
        <div class="card">
            <div class="card-header" style="padding:8px 12px; display:flex; justify-content:space-between; align-items:center; background:var(--bg-card);">
                <span class="text-sm text-tertiary">Event log</span>

    <!-- Screen Recording -->

            <div class="stat-card">

            <div class="card-header">

                    <div class="form-group">
                        <label class="form-label">Target URL</label>

                    <div class="form-group">
                        <label class="form-label">Recording Mode</label>

                            <option value="screen">Screen Only</option>

                            <option value="avi">AVI</option>

                    </div>
                    <div class="form-group">
                        <label class="form-label">Delay Between Pages (ms)</label>

                    </label>

    <!-- Red Team: Auth Profiles -->
    <template id="content-red-auth-profiles">
        <div class="content-header">
            <div>
                <h1 class="content-title">🔑 Auth Profiles</h1>
                <p class="content-subtitle">Manage authentication credentials and login configurations</p>
            </div>
            <div class="content-actions">
                <button class="btn btn-secondary" id="importAuthProfilesBtn">📥 Import</button>
                <button class="btn btn-primary" id="newAuthProfileBtn">+ New Profile</button>
            </div>
        </div>

        <div class="grid grid-2">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Saved Profiles</span>
                    <input type="text" class="input input-sm" placeholder="Search..." style="width:160px;" id="authProfileSearch">
                </div>
                <div class="card-body" id="authProfilesList">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔒</div>
                        <div class="empty-state-title">No Profiles Yet</div>
                        <div class="empty-state-text">Create an authentication profile to enable authenticated scanning.</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title" id="authProfileEditorTitle">New Authentication Profile</span>
                </div>
                <div class="card-body" id="authProfileEditor">
                    <div class="form-group">
                        <label class="form-label">Profile Name</label>
                        <input type="text" class="input" id="authProfileName" placeholder="Production Admin">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Target URL</label>
                        <input type="text" class="input" id="authProfileTarget" placeholder="https://target.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Authentication Type</label>
                        <select class="input" id="authProfileType">
                            <option value="form">Form-Based Login</option>
                            <option value="basic">HTTP Basic Auth</option>
                            <option value="bearer">Bearer Token</option>
                            <option value="oauth2">OAuth2</option>
                            <option value="apikey">API Key</option>
                            <option value="cookie">Cookie</option>
                            <option value="custom">Custom Headers</option>
                        </select>
                    </div>

                    <div id="authFieldsForm" class="auth-type-fields">
                        <div class="form-group">
                            <label class="form-label">Login URL</label>
                            <input type="text" class="input" id="authLoginUrl" placeholder="https://target.com/login">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Username</label>
                                <input type="text" class="input" id="authUsername" placeholder="admin">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input type="password" class="input" id="authPassword" placeholder="••••••">
                            </div>
                        </div>
                    </div>

                    <div id="authFieldsBasic" class="auth-type-fields" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Username</label>
                                <input type="text" class="input" id="authBasicUser" placeholder="admin">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input type="password" class="input" id="authBasicPass" placeholder="••••••">
                            </div>
                        </div>
                    </div>

                    <div id="authFieldsBearer" class="auth-type-fields" style="display:none;">
                        <div class="form-group">
                            <label class="form-label">Bearer Token</label>
                            <input type="text" class="input" id="authBearerToken" placeholder="eyJhbGciOiJIUzI1NiIs...">
                        </div>
                    </div>

                    <div id="authFieldsApiKey" class="auth-type-fields" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">API Key</label>
                                <input type="text" class="input" id="authApiKey" placeholder="sk-...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Header Name</label>
                                <input type="text" class="input" id="authApiHeader" value="X-API-Key" placeholder="X-API-Key">
                            </div>
                        </div>
                    </div>

                    <div id="authFieldsCookie" class="auth-type-fields" style="display:none;">
                        <div class="form-group">
                            <label class="form-label">Cookies (name=value, one per line)</label>
                            <textarea class="input" id="authCookies" rows="3" placeholder="session_id=abc123&#10;csrf_token=xyz789"></textarea>
                        </div>
                    </div>

                    <div id="authFieldsOAuth2" class="auth-type-fields" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Token URL</label>
                                <input type="text" class="input" id="authOAuth2Url" placeholder="https://auth.example.com/oauth/token">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Client ID</label>
                                <input type="text" class="input" id="authOAuth2ClientId" placeholder="my-app">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Client Secret</label>
                            <input type="password" class="input" id="authOAuth2Secret" placeholder="••••••">
                        </div>
                    </div>

                    <div id="authFieldsCustom" class="auth-type-fields" style="display:none;">
                        <div class="form-group">
                            <label class="form-label">Custom Headers (Header: value, one per line)</label>
                            <textarea class="input" id="authCustomHeaders" rows="3" placeholder="X-Custom-Auth: token123&#10;X-Request-ID: 12345"></textarea>
                        </div>
                    </div>

                    <div class="divider"></div>
                    <div class="form-group">
                        <label class="form-label">Multi-Factor Authentication</label>
                        <select class="input" id="authMFA">
                            <option value="none">No MFA</option>
                            <option value="totp">TOTP (Authenticator App)</option>
                            <option value="sms">SMS Code</option>
                            <option value="email">Email Code</option>
                        </select>
                    </div>

                    <div id="totpFields" style="display:none;">
                        <div class="form-group">
                            <label class="form-label">TOTP Secret</label>
                            <input type="text" class="input" id="authTOTPSecret" placeholder="Base32 encoded secret">
                        </div>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button class="btn btn-secondary" id="testAuthBtn">🔑 Test Login</button>
                        <button class="btn btn-primary" id="saveAuthBtn">💾 Save Profile</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Red Team: TOTP Generator -->
    <template id="content-red-totp">
        <div class="content-header">
            <div>
                <h1 class="content-title">⏱️ TOTP Generator</h1>
                <p class="content-subtitle">Time-based One-Time Password generator and validator</p>
            </div>
        </div>

        <div class="grid grid-2">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Generate TOTP</span>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">TOTP Secret (Base32)</label>
                        <div style="display:flex; gap:8px;">
                            <input type="text" class="input" id="totpSecret" placeholder="JBSWY3DPEHPK3PXP" style="flex:1;">
                            <button class="btn btn-secondary" id="generateTotpSecretBtn">🎲 Generate</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Algorithm</label>
                            <select class="input" id="totpAlgorithm" disabled title="Not implemented: the backend has no TOTP algorithm selection support yet">
                                <option value="SHA1">SHA-1</option>
                                <option value="SHA256">SHA-256</option>
                                <option value="SHA512">SHA-512</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Digits</label>
                            <select class="input" id="totpDigits" disabled title="Not implemented: the backend has no TOTP digit count support yet">
                                <option value="6">6 digits</option>
                                <option value="8">8 digits</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Period (seconds)</label>
                            <input type="number" class="input" id="totpPeriod" value="30" min="15" max="120">
                        </div>
                    </div>
                    <button class="btn btn-primary" id="generateTotpBtn">🔄 Generate Code</button>

                    <div id="totpResult" style="display:none; margin-top:24px;">
                        <div style="text-align:center; padding:24px; background:var(--bg-tertiary); border-radius:12px;">
                            <div style="font-size:0.8rem; color:var(--text-tertiary); margin-bottom:8px;">Current TOTP Code</div>
                            <div style="font-size:3rem; font-weight:700; font-family:var(--font-mono); letter-spacing:8px; color:var(--text-primary);" id="totpCodeDisplay">000000</div>
                            <div style="margin-top:12px;">
                                <div class="progress" style="width:200px; margin:0 auto;">
                                    <div class="progress-bar" id="totpCountdownBar" style="width:100%"></div>
                                </div>
                                <div style="font-size:0.8rem; color:var(--text-tertiary); margin-top:4px;" id="totpCountdownText">30s remaining</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Validate & Provisioning</span>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Code to Validate</label>
                        <input type="text" class="input" id="totpValidateCode" placeholder="Enter 6-digit code" maxlength="8">
                    </div>
                    <button class="btn btn-secondary" id="validateTotpBtn">✓ Validate Code</button>
                    <div id="totpValidateResult" style="margin-top:12px;"></div>

                    <div class="divider"></div>

                    <h4 style="margin-bottom:12px;">Provisioning URI</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Account Name</label>
                            <input type="text" class="input" id="totpAccount" placeholder="user@example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Issuer</label>
                            <input type="text" class="input" id="totpIssuer" placeholder="SiteRecorder">
                        </div>
                    </div>
                    <button class="btn btn-secondary" id="getProvisioningUriBtn">📱 Get QR URI</button>
                    <div id="totpUriResult" style="margin-top:12px;"></div>
                </div>
            </div>
        </div>
    </template>

                <div id="auditLogList">
                    <div class="empty-state">

                        <div class="empty-state-text">System activity will be logged here.</div>
                    </div>
                </div>
            </div>
        </div>

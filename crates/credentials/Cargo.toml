[package]
name = "credentials"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Encrypted credential vault with AES-256-GCM encryption"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.21"
zeroize = { version = "1.7", features = ["derive"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"

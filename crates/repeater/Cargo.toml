[package]
name = "repeater"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Manual HTTP request editing and replay - Burp Suite Repeater"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
reqwest = { version = "0.11", features = ["rustls-tls", "stream"], default-features = false }
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

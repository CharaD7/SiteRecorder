[package]
name = "sequencer"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Burp Sequencer clone: entropy and randomness analysis of server-generated values"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
num-bigint = "0.4"
base64 = "0.21"
rand = "0.8"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
[package]
name = "spammer"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Burp Spammer clone: HTTP flood and high-entropy token generation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4", "fast-rng"] }

[dev-dependencies]
tokio-test = "0.4"
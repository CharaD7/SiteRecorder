[package]
name = "packet-inspector"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Wireshark-style packet capture UI layer on top of packet-capture"

[dependencies]
packet-capture = { path = "../packet-capture" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["sync", "macros"] }

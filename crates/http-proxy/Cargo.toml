[package]
name = "http-proxy"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "HTTP/HTTPS intercepting proxy - Burp Suite core functionality"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.5"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
rustls = "0.22"
tokio-rustls = "0.25"
rcgen = "0.12"
rustls-pemfile = "2.0"
futures = "0.3"
tracing = "0.1"
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false }

[dev-dependencies]
tokio-test = "0.4"

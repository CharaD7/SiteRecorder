[package]
name = "agent"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Advisory security agent: capability-gated tool access and pluggable model providers"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
regex = "1.10"

[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }

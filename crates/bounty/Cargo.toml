[package]
name = "bounty"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Bug-bounty program triage, backed by the external ChainScope toolkit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
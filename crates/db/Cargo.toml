[package]
name = "db"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Shared SQLite persistence layer: migrations, schema versioning, and domain models"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
dirs = "5.0"
aes-gcm = "0.10"
base64 = "0.21"
rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
[package]
name = "auditbot"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Bounty audit bot: triage, verify, and report with evidence attached"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["process", "time", "rt", "macros"] }
bounty = { path = "../bounty" }
agent = { path = "../agent" }

[dev-dependencies]
tempfile = "3.10"
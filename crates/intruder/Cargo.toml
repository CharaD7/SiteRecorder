[package]
name = "intruder"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Payload-driven parameter fuzzing - Burp Suite Intruder"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
regex = "1.10"
repeater = { path = "../repeater" }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

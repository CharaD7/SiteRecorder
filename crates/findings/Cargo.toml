[package]
name = "findings"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Finding storage, lifecycle, and the scanner-to-findings ingestion pipeline"

[dependencies]
db = { path = "../db" }
scanner = { path = "../scanner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3.10"

[package]
name = "blue-team"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Blue Team: SOC, incident response, threat intel, forensics"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"

[package]
name = "activity"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Shared event/activity log for SiteRecorder"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "auth-profiles"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Authentication profile management with SQLite persistence and TOTP support"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
totp-rs = { version = "5.5", features = ["qr"] }
rand = "0.8"
base64 = "0.21"
aes-gcm = "0.10"
zeroize = { version = "1.7", features = ["derive"] }

credentials = { path = "../credentials" }

[dev-dependencies]
tempfile = "3.10"

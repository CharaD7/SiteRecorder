[package]
name = "network"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Network scanning and enumeration tools"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = "0.4"
rand = "0.8"
trust-dns-resolver = "0.23"
ipnetwork = "0.20"
pnet = "0.34"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[package]
name = "auth-engine"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Authentication engine for scanning authenticated web applications"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["cookies", "json", "native-tls"] }
scraper = "0.18"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
tracing = "0.1"
base64 = "0.21"
regex = "1.10"

[dev-dependencies]
tokio-test = "0.4"

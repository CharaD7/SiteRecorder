[package]
name = "cloud"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Cloud security assessment: AWS, Azure, GCP"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"

[package]
name = "white-team"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "White Team: GRC, risk register, policy, vendor risk, training"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.10"

[package]
name = "collaborator"
version = "0.1.0"
edition = "2021"
authors = ["CharaTech"]
description = "Burp Collaborator clone: out-of-band beacon generation, interaction server, and polling"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }